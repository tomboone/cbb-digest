# For authoring migrations by hand: `uv run alembic revision -m "..."`, or `--autogenerate`
# against a local database at head. The app itself never reads this file; it upgrades through
# `cbb_digest.db.upgrade`.

[alembic]
script_location = %(here)s/src/cbb_digest/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
sqlalchemy.url = sqlite:///data/cbb-digest.sqlite3

[post_write_hooks]
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
