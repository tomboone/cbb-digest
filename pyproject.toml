[project]
name = "cbb-digest"
version = "1.0.0.dev0"
description = "Weekly men's college basketball digest email, filtered through a watchlist of NBA draft prospects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mjml-python>=1.4.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
]

[project.scripts]
cbb-digest = "cbb_digest.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is reported, not gated.
addopts = "-ra --cov=cbb_digest --cov-report=term-missing"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "syrupy>=6.1.1",
    "types-pyyaml>=6.0.12.20261030",
]
